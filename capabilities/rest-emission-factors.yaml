naftiko: 1.0.0-alpha2
info:
  label: Salesforce Net Zero Cloud REST API — Emission Factors
  description: 'Salesforce Net Zero Cloud REST API — Emission Factors. 1 operations. Lead operation: List Emission Factors.
    Self-contained Naftiko capability covering one Salesforce Net Zero Cloud business surface.'
  tags:
  - Salesforce Net Zero Cloud
  - Emission Factors
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_NET_ZERO_CLOUD_API_KEY: SALESFORCE_NET_ZERO_CLOUD_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-emission-factors
    baseUri: https://{instance}.my.salesforce.com/services/data/v59.0
    description: Salesforce Net Zero Cloud REST API — Emission Factors business capability. Self-contained, no shared references.
    resources:
    - name: sobjects-EmissionFactor
      path: /sobjects/EmissionFactor
      operations:
      - name: listemissionfactors
        method: GET
        description: List Emission Factors
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: category
          in: query
          type: string
          description: Filter by emission factor category
        - name: region
          in: query
          type: string
          description: Filter by geographic region
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_NET_ZERO_CLOUD_API_KEY}}'
  exposes:
  - type: rest
    namespace: rest-emission-factors-rest
    port: 8080
    description: REST adapter for Salesforce Net Zero Cloud REST API — Emission Factors. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/sobjects/emissionfactor
      name: sobjects-emissionfactor
      description: REST surface for sobjects-EmissionFactor.
      operations:
      - method: GET
        name: listemissionfactors
        description: List Emission Factors
        call: rest-emission-factors.listemissionfactors
        with:
          category: rest.category
          region: rest.region
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-emission-factors-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce Net Zero Cloud REST API — Emission Factors. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: list-emission-factors
      description: List Emission Factors
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-emission-factors.listemissionfactors
      with:
        category: tools.category
        region: tools.region
      outputParameters:
      - type: object
        mapping: $.
