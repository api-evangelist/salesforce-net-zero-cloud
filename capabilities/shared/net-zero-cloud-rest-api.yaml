naftiko: "1.0.0-alpha1"

info:
  label: "Salesforce Net Zero Cloud REST API"
  description: "REST API for managing carbon emissions, sustainability goals, energy consumption, waste, and water data in Salesforce Net Zero Cloud."
  tags:
    - Salesforce
    - Net Zero Cloud
    - Carbon Emissions
    - Sustainability
    - ESG
    - Climate
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      SALESFORCE_ACCESS_TOKEN: SALESFORCE_ACCESS_TOKEN

capability:
  consumes:
    - type: http
      namespace: salesforce-net-zero
      baseUri: https://{instance}.my.salesforce.com/services/data/v59.0
      description: "Salesforce Net Zero Cloud REST API"
      authentication:
        type: bearer
        token: "{{SALESFORCE_ACCESS_TOKEN}}"
      resources:
        - name: carbon-emissions
          path: /sobjects/CarbonEmission
          description: "Carbon emission record management"
          operations:
            - name: list-carbon-emissions
              method: GET
              description: "List all carbon emission records"
              inputParameters:
                - name: scope
                  in: query
                  type: integer
                  required: false
                  description: "Filter by emission scope (1, 2, 3)"
                - name: reportingYear
                  in: query
                  type: integer
                  required: false
                  description: "Filter by reporting year"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-carbon-emission
              method: POST
              description: "Create a new carbon emission record"
              body:
                type: json
                data:
                  Scope: "{{tools.scope}}"
                  EmissionSource: "{{tools.emissionSource}}"
                  QuantityMtCO2e: "{{tools.quantityMtCO2e}}"
                  ReportingYear: "{{tools.reportingYear}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: carbon-emission
          path: /sobjects/CarbonEmission/{emissionId}
          description: "Individual carbon emission operations"
          operations:
            - name: get-carbon-emission
              method: GET
              description: "Get a specific carbon emission record"
              inputParameters:
                - name: emissionId
                  in: path
                  type: string
                  required: true
                  description: "Salesforce ID of the emission record"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: update-carbon-emission
              method: PATCH
              description: "Update a carbon emission record"
              inputParameters:
                - name: emissionId
                  in: path
                  type: string
                  required: true
                  description: "Salesforce ID of the emission record"
              body:
                type: json
                data:
                  QuantityMtCO2e: "{{tools.quantityMtCO2e}}"
                  Description: "{{tools.description}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-carbon-emission
              method: DELETE
              description: "Delete a carbon emission record"
              inputParameters:
                - name: emissionId
                  in: path
                  type: string
                  required: true
                  description: "Salesforce ID of the emission record"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: energy-consumption
          path: /sobjects/EnergyConsumption
          description: "Energy consumption record management"
          operations:
            - name: list-energy-consumption
              method: GET
              description: "List energy consumption records"
              inputParameters:
                - name: energyType
                  in: query
                  type: string
                  required: false
                  description: "Filter by energy type"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-energy-consumption
              method: POST
              description: "Create an energy consumption record"
              body:
                type: json
                data:
                  EnergyType: "{{tools.energyType}}"
                  QuantityKWh: "{{tools.quantityKWh}}"
                  ReportingYear: "{{tools.reportingYear}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: energy-consumption-record
          path: /sobjects/EnergyConsumption/{consumptionId}
          description: "Individual energy consumption record"
          operations:
            - name: get-energy-consumption
              method: GET
              description: "Get a specific energy consumption record"
              inputParameters:
                - name: consumptionId
                  in: path
                  type: string
                  required: true
                  description: "Salesforce ID of the energy record"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: sustainability-goals
          path: /sobjects/SustainabilityGoal
          description: "Sustainability goal management"
          operations:
            - name: list-sustainability-goals
              method: GET
              description: "List sustainability goals and net zero targets"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-sustainability-goal
              method: POST
              description: "Create a sustainability goal"
              body:
                type: json
                data:
                  GoalType: "{{tools.goalType}}"
                  BaselineYear: "{{tools.baselineYear}}"
                  TargetYear: "{{tools.targetYear}}"
                  ReductionTargetPercentage: "{{tools.reductionTargetPercentage}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: emission-factors
          path: /sobjects/EmissionFactor
          description: "Emission factor catalog"
          operations:
            - name: list-emission-factors
              method: GET
              description: "List emission factors for calculations"
              inputParameters:
                - name: category
                  in: query
                  type: string
                  required: false
                  description: "Filter by category"
                - name: region
                  in: query
                  type: string
                  required: false
                  description: "Filter by region"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: waste-disposal
          path: /sobjects/WasteDisposal
          description: "Waste disposal record management"
          operations:
            - name: list-waste-disposal-records
              method: GET
              description: "List waste disposal records"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-waste-disposal-record
              method: POST
              description: "Create a waste disposal record"
              body:
                type: json
                data:
                  WasteType: "{{tools.wasteType}}"
                  DisposalMethod: "{{tools.disposalMethod}}"
                  QuantityKg: "{{tools.quantityKg}}"
                  ReportingYear: "{{tools.reportingYear}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: water-withdrawal
          path: /sobjects/WaterWithdrawal
          description: "Water withdrawal record management"
          operations:
            - name: list-water-withdrawal-records
              method: GET
              description: "List water withdrawal records"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-water-withdrawal-record
              method: POST
              description: "Create a water withdrawal record"
              body:
                type: json
                data:
                  WaterSource: "{{tools.waterSource}}"
                  QuantityCubicMeters: "{{tools.quantityCubicMeters}}"
                  ReportingYear: "{{tools.reportingYear}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: sustainability-query
          path: /query
          description: "SOQL query for sustainability data"
          operations:
            - name: query-sustainability-data
              method: GET
              description: "Query sustainability data with SOQL"
              inputParameters:
                - name: q
                  in: query
                  type: string
                  required: true
                  description: "SOQL query string"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: net-zero-cloud-rest
      resources:
        - path: /v1/emissions
          name: carbon-emissions
          description: "Carbon emission management"
          operations:
            - method: GET
              name: list-carbon-emissions
              description: "List carbon emissions"
              call: "salesforce-net-zero.list-carbon-emissions"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-carbon-emission
              description: "Create a carbon emission record"
              call: "salesforce-net-zero.create-carbon-emission"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/emissions/{emissionId}
          name: carbon-emission
          description: "Individual emission operations"
          operations:
            - method: GET
              name: get-carbon-emission
              description: "Get a carbon emission"
              call: "salesforce-net-zero.get-carbon-emission"
              with:
                emissionId: "rest.emissionId"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/goals
          name: sustainability-goals
          description: "Sustainability goal management"
          operations:
            - method: GET
              name: list-sustainability-goals
              description: "List sustainability goals"
              call: "salesforce-net-zero.list-sustainability-goals"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: net-zero-cloud-mcp
      transport: http
      tools:
        - name: list-carbon-emissions
          description: "List all carbon emission records"
          hints:
            readOnly: true
            idempotent: true
          call: "salesforce-net-zero.list-carbon-emissions"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-carbon-emission
          description: "Get a specific carbon emission record"
          hints:
            readOnly: true
            idempotent: true
          call: "salesforce-net-zero.get-carbon-emission"
          with:
            emissionId: "tools.emissionId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-carbon-emission
          description: "Create a new carbon emission record"
          hints:
            readOnly: false
            destructive: false
          call: "salesforce-net-zero.create-carbon-emission"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-sustainability-goals
          description: "List sustainability goals and net zero targets"
          hints:
            readOnly: true
            idempotent: true
          call: "salesforce-net-zero.list-sustainability-goals"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-emission-factors
          description: "List emission factors for carbon accounting calculations"
          hints:
            readOnly: true
            idempotent: true
          call: "salesforce-net-zero.list-emission-factors"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-energy-consumption
          description: "List energy consumption records"
          hints:
            readOnly: true
            idempotent: true
          call: "salesforce-net-zero.list-energy-consumption"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-waste-disposal-records
          description: "List waste disposal records"
          hints:
            readOnly: true
            idempotent: true
          call: "salesforce-net-zero.list-waste-disposal-records"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-water-withdrawal-records
          description: "List water withdrawal records"
          hints:
            readOnly: true
            idempotent: true
          call: "salesforce-net-zero.list-water-withdrawal-records"
          outputParameters:
            - type: object
              mapping: "$."
        - name: query-sustainability-data
          description: "Query sustainability data using SOQL"
          hints:
            readOnly: true
            idempotent: true
          call: "salesforce-net-zero.query-sustainability-data"
          with:
            q: "tools.q"
          outputParameters:
            - type: object
              mapping: "$."
