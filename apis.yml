name: Salesforce Net Zero Cloud
description: >-
  The Salesforce Net Zero Cloud API enables organizations to track, analyze, and report on their carbon emissions and
  sustainability data. It provides programmatic access to environmental data, carbon accounting, and ESG reporting
  capabilities including Scope 1, 2, and 3 emissions tracking, energy consumption, waste management, water usage, and
  sustainability goal management.
image: https://www.salesforce.com/content/dam/web/en_us/www/images/logo-salesforce.svg
url: https://www.salesforce.com/products/net-zero-cloud/overview/
created: '2024'
modified: '2026-05-19'
specificationVersion: '0.18'
tags:
  - Carbon Accounting
  - Carbon Emissions
  - Climate
  - Environmental
  - ESG
  - Net Zero
  - Sustainability
apis:
  - name: Net Zero Cloud REST API
    description: >-
      REST API for managing carbon emissions data, sustainability records, and environmental impact tracking within Net
      Zero Cloud. Supports Scope 1, 2, and 3 emissions, energy consumption, waste disposal, water withdrawal, and
      sustainability goals.
    image: https://www.salesforce.com/content/dam/web/en_us/www/images/logo-salesforce.svg
    humanURL: https://developer.salesforce.com/docs/atlas.en-us.netzero_api.meta/netzero_api/
    baseURL: https://yourinstance.my.salesforce.com/services/data/v59.0/
    tags:
      - Carbon Emissions
      - Emissions Tracking
      - REST
      - Sustainability
    properties:
      - type: Documentation
        url: https://developer.salesforce.com/docs/atlas.en-us.netzero_api.meta/netzero_api/
      - type: OpenAPI
        url: openapi/salesforce-net-zero-cloud-rest-api-openapi.yml
      - type: Authentication
        url: https://developer.salesforce.com/docs/atlas.en-us.api_rest.meta/api_rest/intro_oauth_and_connected_apps.htm
      - type: RateLimits
        url: >-
          https://developer.salesforce.com/docs/atlas.en-us.salesforce_app_limits_cheatsheet.meta/salesforce_app_limits_cheatsheet/
    contact:
      - type: Support
        url: https://help.salesforce.com/
  - name: Carbon Accounting API
    description: >-
      API endpoints for carbon footprint calculations, emission factors, and sustainability metrics aggregation. Enables
      retrieval of emission factors and calculation of CO2e from activity data.
    humanURL: https://developer.salesforce.com/docs/atlas.en-us.netzero_api.meta/netzero_api/
    baseURL: https://yourinstance.my.salesforce.com/services/data/v59.0/
    tags:
      - Carbon Accounting
      - Emission Factors
      - Footprint Calculation
    properties:
      - type: Documentation
        url: https://developer.salesforce.com/docs/atlas.en-us.netzero_api.meta/netzero_api/
  - name: Sustainability Data API
    description: >-
      API for accessing and managing sustainability data including energy consumption, waste management, water usage,
      and renewable energy tracking.
    humanURL: https://developer.salesforce.com/docs/atlas.en-us.netzero_api.meta/netzero_api/
    baseURL: https://yourinstance.my.salesforce.com/services/data/v59.0/
    tags:
      - Energy Consumption
      - Sustainability Data
      - Waste Management
      - Water Usage
    properties:
      - type: Documentation
        url: https://developer.salesforce.com/docs/atlas.en-us.netzero_api.meta/netzero_api/
